<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChargeHub 运营决策大屏</title>
  <script src="echarts.min.js"></script>
  <style>
    :root {
      --bg: #06140f;
      --panel: #0c241b;
      --line: #1b4a36;
      --text: #d7ffe8;
      --mute: #7fb89a;
      --accent: #69f0ae;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .page {
      height: 100vh; box-sizing: border-box; padding: 8px 10px;
      display: grid; grid-template-rows: 52px 58px minmax(0, 1fr); gap: 8px;
    }
    header, .kpis, .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    }
    header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    h1 { margin: 0; font-size: 18px; letter-spacing: 3px; color: var(--accent); }
    .meta { color: var(--mute); font-size: 12px; }
    .kpis { display: grid; grid-template-columns: repeat(6, 1fr); min-height: 0; }
    .kpi { padding: 6px 10px; border-right: 1px solid var(--line); }
    .kpi:last-child { border-right: none; }
    .kpi span { display: block; color: var(--mute); font-size: 11px; }
    .kpi b { font-size: 17px; color: #fff; }
    .body { display: grid; grid-template-columns: minmax(0, 3fr) minmax(240px, 1fr); gap: 8px; min-height: 0; }
    .charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0; }
    .panel { min-height: 0; padding: 4px 6px 2px; display: flex; flex-direction: column; overflow: hidden; }
    .chart { flex: 1; min-height: 0; width: 100%; }
    .side { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
    .alerts { overflow: auto; padding: 8px 10px; font-size: 12px; }
    .alert { margin: 0 0 8px; padding: 6px 8px; border-radius: 6px; background: #123328; }
    .alert.严重 { border-left: 3px solid #ef5350; }
    .alert.一般 { border-left: 3px solid #ffca28; }
    .alert.提示 { border-left: 3px solid #26c6da; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--accent); }
    .report { padding: 8px 10px; font-size: 12px; color: var(--mute); }
    .report b { color: #fff; }
    @media (max-width: 1100px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; }
      .kpis { grid-template-columns: repeat(3, 1fr); }
      .body, .charts { display: block; }
      .panel { height: 28vh; margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>CHARGEHUB 充电运营驾驶舱</h1>
      <div class="meta">只读大屏 · 5 秒刷新 · UTC+8 · <span id="clock">--:--:--</span></div>
    </header>
    <div class="kpis">
      <div class="kpi"><span>今日营收</span><b id="k1">¥ 0.00</b></div>
      <div class="kpi"><span>本月营收</span><b id="k2">¥ 0.00</b></div>
      <div class="kpi"><span>今日电量</span><b id="k3">0 kWh</b></div>
      <div class="kpi"><span>今日订单 / 活跃用户</span><b id="k4">0 / 0</b></div>
      <div class="kpi"><span>注册用户</span><b id="k5">0</b></div>
      <div class="kpi"><span>MAE / RMSE</span><b id="k6">--</b></div>
    </div>
    <div class="body">
      <div class="charts">
        <div class="panel"><div id="c1" class="chart"></div></div>
        <div class="panel"><div id="c2" class="chart"></div></div>
        <div class="panel"><div id="c3" class="chart"></div></div>
        <div class="panel"><div id="c4" class="chart"></div></div>
        <div class="panel"><div id="c5" class="chart"></div></div>
        <div class="panel"><div id="c6" class="chart"></div></div>
      </div>
      <div class="side">
        <div class="panel report" id="report">模型未就绪，请在管理端点击「刷新智能分析」</div>
        <div class="panel alerts" id="alerts">暂无告警</div>
        <div class="panel alerts">
          <table>
            <thead><tr><th>电站</th><th>窗口</th><th>kWh</th><th>空闲</th></tr></thead>
            <tbody id="fc"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script>
    const ids = ['c1','c2','c3','c4','c5','c6'];
    const charts = ids.map(id => echarts.init(document.getElementById(id), null, { renderer: 'canvas' }));
    const base = {
      textStyle: { color: '#c8f7dc', fontSize: 11 },
      grid: { left: 8, right: 8, top: 28, bottom: 4, containLabel: true },
      tooltip: { trigger: 'axis', confine: true },
      title: { left: 6, top: 2, textStyle: { color: '#69f0ae', fontSize: 12, fontWeight: 600 } }
    };
    function axis() {
      return {
        axisLabel: { color: '#8fbfa8', fontSize: 10 },
        axisLine: { lineStyle: { color: '#1b4a36' } },
        splitLine: { lineStyle: { color: '#143226' } }
      };
    }
    function set(i, opt) { charts[i].setOption(Object.assign({}, base, opt), true); }

    async function refresh() {
      let ov, an;
      try {
        [ov, an] = await Promise.all([
          fetch('/api/overview').then(x => x.json()),
          fetch('/api/analysis').then(x => x.json())
        ]);
      } catch (e) { return; }
      document.getElementById('clock').textContent = ov.updated;
      document.getElementById('k1').textContent = '¥ ' + ov.today.amount.toFixed(2);
      document.getElementById('k2').textContent = '¥ ' + ov.month.amount.toFixed(2);
      document.getElementById('k3').textContent = ov.today.energy.toFixed(1) + ' kWh';
      document.getElementById('k4').textContent = ov.today.orders + ' / ' + ov.activeToday;
      document.getElementById('k5').textContent = ov.users;
      const rp = an.report || {};
      document.getElementById('k6').textContent = rp.mae != null
        ? Number(rp.mae).toFixed(3) + ' / ' + Number(rp.rmse).toFixed(3) : '--';
      document.getElementById('report').innerHTML = rp.model_version
        ? `模型 <b>${rp.model_version}</b> · 天气 <b>${rp.weather || '-'}</b><br/>样本 ${rp.sample_n || 0} · 时间序 8:2 验证 · 只写分析表`
        : '模型未就绪，请在 Qt 管理端「智能分析」点击刷新';

      const alerts = an.alerts || [];
      document.getElementById('alerts').innerHTML = alerts.length
        ? alerts.map(a => `<div class="alert ${a.level}"><b>${a.level}</b> ${a.title}<br/>${a.detail}</div>`).join('')
        : '<div class="alert 提示">暂无告警</div>';
      const fcs = an.forecasts || [];
      document.getElementById('fc').innerHTML = fcs.map(f =>
        `<tr><td>${f.name}</td><td>${f.horizon_hours}h</td><td>${Number(f.pred_kwh).toFixed(1)}</td><td>${f.pred_idle}</td></tr>`
      ).join('') || '<tr><td colspan="4">暂无预测</td></tr>';

      set(0, {
        title: { ...base.title, text: '近7日营收 / 电量' },
        legend: { data: ['营收', '电量'], textStyle: { color: '#9fd', fontSize: 10 }, top: 2, right: 4 },
        xAxis: { type: 'category', data: ov.trend.map(i => i.date), ...axis() },
        yAxis: [{ type: 'value', ...axis() }, { type: 'value', ...axis() }],
        series: [
          { name: '营收', type: 'line', smooth: true, data: ov.trend.map(i => i.amount), areaStyle: { opacity: 0.12 }, lineStyle: { color: '#69f0ae' }, itemStyle: { color: '#69f0ae' } },
          { name: '电量', type: 'bar', yAxisIndex: 1, data: ov.trend.map(i => i.energy), itemStyle: { color: '#26a69a' } }
        ]
      });
      set(1, {
        title: { ...base.title, text: '电桩状态占比' },
        tooltip: { trigger: 'item', confine: true },
        series: [{
          type: 'pie', radius: ['36%', '62%'], center: ['50%', '58%'],
          label: { color: '#c8f7dc', fontSize: 10 },
          data: ov.piles.map(p => ({ name: p.status, value: p.n }))
        }]
      });
      set(2, {
        title: { ...base.title, text: '各站空闲桩' },
        xAxis: { type: 'category', data: ov.idleRank.map(i => i.name), ...axis(), axisLabel: { ...axis().axisLabel, rotate: 18 } },
        yAxis: { type: 'value', ...axis() },
        series: [{ type: 'bar', data: ov.idleRank.map(i => i.idle), itemStyle: { color: '#26c6da' } }]
      });

      const hourMap = {};
      (an.hourly || []).forEach(h => {
        hourMap[h.hour] = (hourMap[h.hour] || 0) + Number(h.pred_kwh || 0);
      });
      const hs = [...Array(24).keys()].map(i => ({ x: (i < 10 ? '0' : '') + i, y: +(hourMap[i] || 0).toFixed(2) }));
      set(3, {
        title: { ...base.title, text: '未来24h负荷预测 (kWh)' },
        xAxis: { type: 'category', data: hs.map(i => i.x), ...axis() },
        yAxis: { type: 'value', ...axis() },
        series: [{ type: 'line', smooth: true, data: hs.map(i => i.y), areaStyle: { opacity: 0.16 }, lineStyle: { color: '#ffca28' }, itemStyle: { color: '#ffca28' } }]
      });
      set(4, {
        title: { ...base.title, text: '用户充电时段分布' },
        xAxis: { type: 'category', data: ov.hours.map(i => i.hour), ...axis() },
        yAxis: { type: 'value', ...axis() },
        series: [{ type: 'bar', data: ov.hours.map(i => i.orders), itemStyle: { color: '#81c784' } }]
      });
      set(5, {
        title: { ...base.title, text: '站点地理分布（经纬度）' },
        tooltip: { trigger: 'item', formatter: p => `${p.data[2]}<br/>空闲 ${p.data[3]}/${p.data[4]}<br/>营收 ¥${p.data[5]}`, confine: true },
        xAxis: { type: 'value', name: 'lng', ...axis(), scale: true },
        yAxis: { type: 'value', name: 'lat', ...axis(), scale: true },
        series: [{
          type: 'scatter',
          symbolSize: v => 10 + Math.min(22, (v[4] || 1) * 3),
          data: ov.geo.map(g => [g.lng, g.lat, g.name, g.idle, g.total, g.amount]),
          itemStyle: { color: '#69f0ae' }
        }]
      });
    }
    refresh();
    setInterval(refresh, 5000);
    window.addEventListener('resize', () => charts.forEach(c => c.resize()));
  </script>
</body>
</html>
